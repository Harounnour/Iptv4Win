name: Android TV APK
on:
  push:
    branches: [feature/android-tv]
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  pull_request:
    paths:
      - 'android-tv/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build Android TV APK
        working-directory: android-tv
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew --no-daemon assembleDebug; else
            echo "Gradle wrapper is not present; install Gradle and build."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV4Win-TV-debug
          path: android-tv/app/build/outputs/apk/debug/*.apk
